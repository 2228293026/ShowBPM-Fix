name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Restore game DLLs from git history
      run: git checkout v1.4.3 -- libs/

    - name: Extract version from tag
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Update Info.json
      shell: pwsh
      run: |
        $info = Get-Content Info.json -Raw | ConvertFrom-Json
        $info.Version = "$env:VERSION"
        $info | ConvertTo-Json | Set-Content Info.json -Encoding UTF8

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore NuGet packages
      run: nuget restore ShowBPM.sln

    - name: Build
      run: msbuild ShowBPM.sln /p:Configuration=Release /p:Platform="Any CPU" /p:Version="$env:VERSION"

    - name: Create archive
      shell: pwsh
      run: |
        Compress-Archive -Path ShowBPM\bin\Release\net4.8\ShowBPM.dll,Info.json -DestinationPath ShowBPM-${{ github.ref_name }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: ShowBPM ${{ github.ref_name }}
        generate_release_notes: true
        files: ShowBPM-${{ github.ref_name }}.zip
